
<!--ACTIVE PREDICTION-->


<a href="{% url 'predicts:match_prediction_update' prediction.match.match_id %}" class="text-decoration-none">
    <div class="fixture row shadow p-2 mb-2 mx-1 border rounded-pill">
        <div class="fs-6 fw-light text-center mb-3 text-secondary">{{prediction.match.date|date}} </div>
        <div class="home col-6 text-end p-0">
            <span class="fw-bold">{{prediction.match.hTeam_name}}</span>
            <span class="border px-3 py-2 bg-light">{{prediction.homeTeamScore}}</span>
        </div>

        <div class="away col-6 text-left p-0">
            <span class="border px-3 py-2 bg-light text-left">{{prediction.awayTeamScore}}</span>
            <span class="fw-bold">{{ prediction.match.aTeam_name}}</span>
        </div>

        <div class="fs-6 fw-light text-center mb-1 mt-1 text-secondary">{{prediction.goalScorerName}}</div>
        <p class="text-center card-subtitle  text-muted">{{prediction.match.date|time:'H:i'}}</p>

        <div class="col text-center ">
            {% comment %} <p class='fw-light text-secondary d-block'>{{prediction.match.league}}</p>   {% endcomment %}
        </div>
    </div>
</a>
